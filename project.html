<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Derek Han</title>
  <meta name="description" content="Project details — Derek Han." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
</head>
<body data-page="project">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-bind="site.brandMark">DH</span>
        <span class="brand-name" data-bind="site.name">Derek Han</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="projects.html" aria-current="page">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="experience.html">Experience</a>
        <a href="resume.html">Resume</a>
        <a href="awards-skills.html">Awards &amp; Skills</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="page-head">
      <div class="wrap">
        <p style="margin:0 0 12px;"><a href="projects.html" class="muted" style="font-family: var(--font-mono); font-size: .82rem;">&larr; All projects</a></p>
        <h1 id="project-title">Project</h1>
        <div id="project-meta" class="card-meta"></div>
      </div>
    </div>

    <section class="wrap">
      <article class="prose">
        <div class="project-gallery-wrap">
          <div id="project-images" class="project-gallery"></div>
          <button class="project-gallery-nav gallery-prev" type="button" aria-label="Previous images" hidden>&#8249;</button>
          <button class="project-gallery-nav gallery-next" type="button" aria-label="Next images" hidden>&#8250;</button>
        </div>
        <div id="project-description"></div>
        <div id="project-links" class="hero-actions" style="margin-top:28px;"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; <span id="year"></span> <span data-bind="site.name">Derek Han</span></span>
      <span class="footer-links">
        <a href="#" data-social="email">Email</a>
        <a href="#" data-social="linkedin">LinkedIn</a>
        <a href="#" data-social="github">GitHub</a>
      </span>
    </div>
  </footer>

  <!-- Lightbox viewer (used by main.js for project images and the gallery) -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-close" data-close type="button" aria-label="Close">&times;</button>
    <button class="lightbox-prev" data-prev type="button" aria-label="Previous image">&#8249;</button>
    <button class="lightbox-next" data-next type="button" aria-label="Next image">&#8250;</button>
    <figure class="lightbox-fig">
      <img id="lightbox-img" src="" alt="" />
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <!-- Templates used by render.js for the project detail page -->
  <template id="tpl-detail-image">
    <figure class="project-figure" data-lightbox>
      <img alt="" loading="lazy" />
      <figcaption></figcaption>
    </figure>
  </template>
  <template id="tpl-detail-link"><a class="btn" target="_blank" rel="noopener"></a></template>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/render.js"></script>
</body>
</html>
