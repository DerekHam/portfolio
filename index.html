<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Derek Han — Engineering Portfolio</title>
  <meta name="description" content="Portfolio of Derek Han, a STEM/engineering student. Projects, experience, awards, and skills." />
  <meta name="author" content="Derek Han" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Derek Han — Engineering Portfolio" />
  <meta property="og:description" content="Projects, experience, awards, and skills of Derek Han." />
  <meta property="og:image" content="assets/img/placeholder.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-bind="site.brandMark">DH</span>
        <span class="brand-name" data-bind="site.name">Derek Han</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="index.html" aria-current="page">Home</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="experience.html">Experience</a>
        <a href="resume.html">Resume</a>
        <a href="awards-skills.html">Awards &amp; Skills</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero">
      <img class="hero-banner" data-attrs="src:banner" alt="" aria-hidden="true" />
      <div class="wrap hero-inner">
        <div class="hero-grid">
          <div>
            <span class="eyebrow" data-bind="eyebrow"></span>
            <h1 data-bind="name"></h1>
            <p class="lead" data-bind="lead"></p>
            <div class="hero-actions">
              <a class="btn btn--primary" href="projects.html">View Projects</a>
              <a class="btn" href="resume.html">Resume / CV</a>
              <a class="btn btn--ghost" href="contact.html">Get in Touch</a>
            </div>
          </div>
          <img class="avatar" data-attrs="src:photo,alt:name" alt="Portrait" width="210" height="210" />
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="wrap reveal">
      <div class="section-head">
        <span class="kicker">[ 01 — About ]</span>
        <h2 data-bind="aboutHeading"></h2>
      </div>
      <div class="prose" data-bind="about" data-html="true"></div>
    </section>

    <!-- FEATURED PROJECTS -->
    <section class="wrap reveal">
      <div class="section-head">
        <span class="kicker">[ 02 — Selected Work ]</span>
        <h2>Featured Projects</h2>
      </div>
      <div id="featured-projects" class="grid grid--3"></div>
      <p style="margin-top: 24px;">
        <a class="btn" href="projects.html">Browse all projects &rarr;</a>
      </p>
      <p style="margin-top: 12px;">
        <a class="muted" href="gallery.html" style="font-family: var(--font-mono); font-size: 0.8rem;">Photos &amp; artwork &rarr;</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; <span id="year"></span> <span data-bind="site.name">Derek Han</span></span>
      <span class="footer-links">
        <a href="#" data-social="email">Email</a>
        <a href="#" data-social="linkedin">LinkedIn</a>
        <a href="#" data-social="github">GitHub</a>
      </span>
    </div>
  </footer>

  <!-- Card markup used by render.js for the featured grid -->
  <template id="project-card">
    <article class="card reveal">
      <a class="card-media" aria-hidden="true" tabindex="-1">
        <img alt="" loading="lazy" />
      </a>
      <div class="card-body">
        <div class="card-meta"><span data-bind="date"></span></div>
        <h3 class="card-title"><a data-bind="title" data-html></a></h3>
        <p data-bind="summary"></p>
        <div class="card-foot">
          <div class="tags" data-list="tags">
            <template><span class="tag" data-bind="."></span></template>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/render.js"></script>
</body>
</html>
