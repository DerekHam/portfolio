<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract engineering blueprint banner">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.55" stop-color="#dbe4ec"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#2b6cb0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2b6cb0" stop-opacity="0"/>
    </radialGradient>
    <g id="plus" stroke="#7f97ad" stroke-width="1.1" opacity="0.5">
      <path d="M-7 0 H7 M0 -7 V7"/>
    </g>
  </defs>

  <rect width="1600" height="520" fill="url(#bgg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <!-- radar / concentric arcs -->
  <g fill="none" stroke="#8fa6bb" stroke-width="1.2" opacity="0.5">
    <circle cx="1230" cy="270" r="70"/>
    <circle cx="1230" cy="270" r="130"/>
    <circle cx="1230" cy="270" r="190"/>
    <circle cx="1230" cy="270" r="250"/>
    <path d="M1230 270 L1490 10 M1230 270 L970 10 M1230 270 L970 530 M1230 270 L1490 530 M1230 270 L1600 270 M1230 270 L860 270"/>
  </g>

  <!-- protractor arcs -->
  <g fill="none" stroke="#7f97ad" stroke-width="1" opacity="0.45">
    <path d="M120 470 A 260 260 0 0 1 640 470"/>
    <path d="M120 470 A 200 200 0 0 1 560 470"/>
    <path d="M120 470 A 140 140 0 0 1 480 470"/>
    <path d="M120 470 A 80 80 0 0 1 400 470"/>
  </g>

  <!-- dimension line -->
  <g stroke="#8fa6bb" stroke-width="1" opacity="0.4">
    <path d="M120 500 H1480"/>
    <path d="M120 491 V509 M1480 491 V509"/>
  </g>

  <!-- dashed trajectory -->
  <path d="M40 130 C 340 30, 620 210, 900 150 S 1380 80, 1570 180"
        fill="none" stroke="#e8590c" stroke-width="1.6" stroke-dasharray="8 8" opacity="0.45"/>

  <!-- registration marks -->
  <use href="#plus" x="220" y="120"/>
  <use href="#plus" x="520" y="90"/>
  <use href="#plus" x="760" y="300"/>
  <use href="#plus" x="1080" y="120"/>
  <use href="#plus" x="1420" y="330"/>
  <use href="#plus" x="360" y="360"/>
  <use href="#plus" x="1320" y="90"/>
</svg>
